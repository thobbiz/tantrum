services:
  backend1:
    build: ./mock-backend
    environment:
      - PORT=8080
    ports:
      - "8081:8080"

  backend2:
    build: ./mock-backend
    environment:
      - PORT=8080
    ports:
      - "8082:8080"

  backend3:
    build: ./mock-backend
    environment:
      - PORT=8080
    ports:
      - "8083:8080"

  tantrum:
    build: .
    environment:
      # Compose gives each service a DNS name matching its service name,
      # so backend1/backend2/backend3 resolve to the right containers.
      - BACKENDS=http://backend1:8080,http://backend2:8080,http://backend3:8080
      - HEALTH_INTERVAL=5s
    ports:
      - "8080:8080"
    depends_on:
      - backend1
      - backend2
      - backend3
